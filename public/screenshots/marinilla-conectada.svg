  <text x="100" y="225" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="14">Encuentra restaurantes, ferreterías, servicios y marcas de Marinilla con contacto directo a WhatsApp.</text>
  <rect x="100" y="245" width="190" height="32" rx="16" fill="#0284c7"/>
  <text x="120" y="266" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔍 Buscar por Sector o Barrio</text>

