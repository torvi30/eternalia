  <text x="915" y="435" font-size="50" text-anchor="middle">☕</text>
  <text x="820" y="545" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Café El Balcón Colonial</text>
  <text x="820" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Vista panorámica y postres tradicionales</text>
  <text x="820" y="630" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Calle del Convento • Abierto</text>
  <rect x="990" y="610" width="130" height="36" rx="10" fill="url(#cyanAccent)"/>
