  <text x="80" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pan artesanal caliente desde las 5:30 am</text>
  <text x="80" y="630" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Parque Principal • Abierto</text>
