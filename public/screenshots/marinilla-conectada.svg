  <text x="450" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cortes de res y cerdo con entrega a domicilio</text>
  <text x="450" y="630" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Sector Cantón • Domicilios</text>
  <rect x="620" y="610" width="130" height="36" rx="10" fill="url(#cyanAccent)"/>
