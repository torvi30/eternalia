  </defs>

  <rect width="1200" height="750" fill="url(#bgMarinilla)"/>

  <!-- Browser Bar -->
  <rect width="1200" height="48" fill="#13242a"/>
  <circle cx="30" cy="24" r="6" fill="#ef4444"/>
